# Disk Usage Analyzer — Docker Compose (Linux containers)
#
# Usage:
#   1. Copy .env.example to .env.
#   2. docker compose up --build
#   3. Open http://127.0.0.1:3456/
#
# SAFETY MODEL
# ------------
#   * Host drives are mounted READ-ONLY for scanning (/mnt/c, /mnt/d).
#   * NO cleanup mounts, NO writable volumes, NO shell execution.
#   * Container root filesystem is read-only; only /tmp (tmpfs) is writable.
#   * The application is 100% read-only — no delete endpoints, no write endpoints.

services:
  analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: disk-usage-analyzer:latest
    container_name: disk-usage-analyzer
    restart: unless-stopped
    ports:
      # Bind to localhost only: the UI is not exposed to the network.
      - "127.0.0.1:3456:3456"
    environment:
      HOST: 0.0.0.0
      PORT: 3456
      # Remap C:\... and D:\... whitelist paths onto the read-only bind mounts.
      SCAN_HOST_MOUNT: '{"c":"/mnt/c","d":"/mnt/d"}'
      SCAN_TIMEOUT_MS: 180000
    volumes:
      # --- Scan mounts (READ-ONLY) ---
      - type: bind
        source: C:\
        target: /mnt/c
        read_only: true
      - type: bind
        source: ${D_DRIVE_SOURCE:-D:\}
        target: /mnt/d
        read_only: true

    # Container root filesystem is read-only; only /tmp (tmpfs) is writable.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3456/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s